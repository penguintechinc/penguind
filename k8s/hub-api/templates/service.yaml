apiVersion: v1
kind: Service
metadata:
  name: {{ include "hub-api.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hub-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "hub-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    {{- if include "hub-api.passthrough" . }}
    - name: https-mtls
      port: {{ .Values.ingress.mtls.passthroughPort }}
      targetPort: https-mtls
    {{- end }}
