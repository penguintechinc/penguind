apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hub-api.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hub-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "hub-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hub-api.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "hub-api.name" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hub-api
          image: {{ include "hub-api.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
            {{- if include "hub-api.passthrough" . }}
            - name: https-mtls
              containerPort: {{ .Values.ingress.mtls.passthroughPort }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "hub-api.name" . }}
          env:
            - name: HUB_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.db.name is required" .Values.secrets.db.name }}
                  key: {{ .Values.secrets.db.key }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.s3.name is required" .Values.secrets.s3.name }}
                  key: {{ .Values.secrets.s3.accessKeyKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.s3.name }}
                  key: {{ .Values.secrets.s3.secretKeyKey }}
            - name: OIDC_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.oidc.name is required" .Values.secrets.oidc.name }}
                  key: {{ .Values.secrets.oidc.issuerKey }}
            - name: OIDC_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.oidc.name }}
                  key: {{ .Values.secrets.oidc.audienceKey }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            {{- range $k, $v := .Values.otel.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
