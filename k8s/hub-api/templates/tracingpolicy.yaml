{{- if .Values.tetragon.enabled }}
# Enforced exec allowlist: any execve of a binary outside this list kills the process.
# A shell/curl/nc dropped by a compromised dependency never runs in this container.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: {{ include "hub-api.name" . }}-exec-allowlist
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hub-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hub-api.selectorLabels" . | nindent 6 }}
  kprobes:
    # security_bprm_check sees the resolved binary for execve AND execveat.
    - call: "security_bprm_check"
      syscall: false
      args:
        - index: 0
          type: "linux_binprm"
      selectors:
        - matchArgs:
            - index: 0
              operator: "NotEqual"
              values:
                {{- toYaml .Values.tetragon.allowedBinaries | nindent 16 }}
          matchActions:
            - action: Sigkill
        # Explicit deny for exec from writable mounts (also covered by the allowlist above).
        - matchArgs:
            - index: 0
              operator: "Prefix"
              values:
                {{- toYaml .Values.tetragon.deniedExecPrefixes | nindent 16 }}
          matchActions:
            - action: Sigkill
{{- end }}
