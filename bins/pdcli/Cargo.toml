[package]
name = "pdcli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# All tree-building, request-shaping, and rendering logic lives here — this
# binary only owns the socket connection and stdin/stdout. Not a workspace
# dependency (only added there per-milestone as each crate lands), so it is
# referenced by path.
penguin-cli-core = { path = "../../crates/penguin-cli-core" }
penguin-proto.workspace = true
# The daemon connection itself. Kept out of penguin-cli-core so that crate
# never links a socket, matching penguin-daemon's own split between library
# and transport (see that crate's Cargo.toml).
penguin-ipc.workspace = true
tonic.workspace = true
tokio.workspace = true
clap.workspace = true
# `pdcli hub`: HTTPS client for hub-api and the OIDC provider. Same setup as
# penguin-update (rustls on aws-lc-rs + webpki roots, never `ring`).
reqwest.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
url.workspace = true
serde_json.workspace = true
# Admin token storage in the OS keychain only; no plaintext file fallback.
keyring.workspace = true

[dev-dependencies]
# Mock hub/IdP built from the v1.yaml envelope and problem schemas.
wiremock.workspace = true
base64.workspace = true
# Test-only signing of fixture manifests; same pin as penguin-update.
minisign = "=0.9.1"
