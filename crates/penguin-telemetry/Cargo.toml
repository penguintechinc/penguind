[package]
name = "penguin-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Implements sdk::Logger and sdk::Metrics with concrete backends.
penguin-sdk.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
prometheus.workspace = true
thiserror.workspace = true
# OTLP emission (logs + metrics + traces), gated behind the
# `penguind.otel-telemetry` feature flag — see `src/otel.rs`.
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
# Builds the OTLP/gRPC exporter's per-request metadata (OTEL_EXPORTER_OTLP_HEADERS).
tonic.workspace = true
# `OtelPipeline::shutdown_with_timeout`'s spawn_blocking + timeout wrapper —
# already resolved workspace-wide with a superset of these features, so this
# adds no new tokio version/feature combination to the dependency graph.
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
