# Dependabot for the penguin repo: the Rust workspace (root) and pinned
# GitHub Actions. The frozen go-client/ Go module was removed (its go.mod
# only ever generated stale bump PRs against code that would never accept
# them) — see git history for the gomod ecosystem entry that tracked it.
version: 2
updates:
  # Rust workspace dependencies.
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "release/v0.1.X"
    schedule:
      interval: "weekly"
  # Keep pinned GitHub Actions commit SHAs current.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "release/v0.1.X"
    schedule:
      interval: "weekly"
