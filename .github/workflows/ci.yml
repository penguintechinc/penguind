# PR gate for the Rust workspace: format, clippy (warnings = errors), build,
# tests, and supply-chain (cargo-deny + cargo-audit). Actions pinned to commit
# SHAs.
name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    container: rust:1.97-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: protoc
        # tonic-prost-build (penguin-proto) shells out to protoc at build time;
        # the base rust image ships neither it nor the well-known types.
        # libprotobuf-dev provides google/protobuf/*.proto, which the vendored
        # go-plugin grpc_stdio.proto imports — protobuf-compiler alone is not
        # enough and fails with a confusing "File not found" on that import.
        # jq is bundled here too: make smoke-test's `cargo metadata | jq` needs
        # it and rust:1.97-bookworm doesn't ship it either.
        run: apt-get update && apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev jq
      - name: components
        run: rustup component add rustfmt clippy
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace --locked
      - name: test
        run: cargo test --workspace --locked
      - name: smoke-test
        # Reuses this job's build (smoke-test depends on `build`); a separate
        # job would rebuild the whole workspace from scratch for no benefit.
        run: make smoke-test

  supply-chain:
    runs-on: ubuntu-latest
    container: rust:1.97-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-deny (licenses, bans, sources, advisories)
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      - name: cargo-audit (RustSec advisories)
        run: |
          cargo install cargo-audit --locked
          cargo audit
