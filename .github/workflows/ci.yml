# PR gate for the Rust workspace: format, clippy (warnings = errors), build,
# tests, and supply-chain (cargo-deny + cargo-audit). Actions pinned to commit
# SHAs.
name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ${{ ((github.event_name == 'pull_request' && (github.base_ref == 'main' || github.event.pull_request.head.repo.full_name != github.repository)) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'release') && 'ubuntu-latest' || fromJSON('{"group":"dal2alpha"}') }}
    container: rust:1.97-bookworm@sha256:0e2bcaef56d041a486784e54104a81aebe0da44bd03019bd70bc0401e42e4a97
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # protoc: pinned sha-verified release zip (no apt/sudo; rootless-safe).
      # jq: `make smoke-test` pipes `cargo metadata | jq`.
      - uses: ./.github/actions/setup-protoc
      - uses: ./.github/actions/setup-jq
      - name: components
        run: rustup component add rustfmt clippy
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace --locked
      - name: test
        run: cargo test --workspace --locked
      - name: smoke-test
        # Reuses this job's build (smoke-test depends on `build`); a separate
        # job would rebuild the whole workspace from scratch for no benefit.
        run: make smoke-test

  telemetry-validation:
    runs-on: ${{ ((github.event_name == 'pull_request' && (github.base_ref == 'main' || github.event.pull_request.head.repo.full_name != github.repository)) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'release') && 'ubuntu-latest' || fromJSON('{"group":"dal2alpha"}') }}
    # No Docker daemon in ARC kubernetes mode: the OTLP sink runs as a
    # pinned otelcol-contrib process inside the job container instead.
    container: rust:1.97-bookworm@sha256:0e2bcaef56d041a486784e54104a81aebe0da44bd03019bd70bc0401e42e4a97
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-protoc
      - uses: ./.github/actions/setup-jq
      - uses: ./.github/actions/setup-otelcol
      - name: Telemetry Validation gate (real OTLP collector, flag-on + flag-off)
        run: make test-telemetry

  supply-chain:
    runs-on: ${{ ((github.event_name == 'pull_request' && (github.base_ref == 'main' || github.event.pull_request.head.repo.full_name != github.repository)) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'release') && 'ubuntu-latest' || fromJSON('{"group":"dal2alpha"}') }}
    container: rust:1.97-bookworm@sha256:0e2bcaef56d041a486784e54104a81aebe0da44bd03019bd70bc0401e42e4a97
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-deny (licenses, bans, sources, advisories)
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      - name: cargo-audit (RustSec advisories)
        run: |
          cargo install cargo-audit --locked
          cargo audit
