# Release: Windows MSI (Rust build)
#
# On a version tag, build penguind.exe + pdcli.exe natively for
# windows/amd64, package them into an MSI with WiX v5, and upload it to the
# GitHub Release. Runs on windows-latest because WiX's MSI Bind backend
# P/Invokes the Windows-only msi.dll and therefore cannot emit an .msi on
# Linux/macOS — same constraint the Go build had.
#
# penguin-tray is deliberately NOT included in this MSI (matches the Go
# reference's decision — see packaging/windows/penguind.wxs's header comment
# for the rationale and the revisit condition).
#
# Actions pinned to commit SHAs per policy.
name: Release Windows MSI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Same protoc pin/rationale as release.yml and release-tray.yml.
  PROTOC_VERSION: '35.1'
  PROTOC_ZIP: protoc-35.1-win64.zip
  PROTOC_SHA256: 5d3ff218d7d91eea95f7569bcb5a98f3030f8996d44151279d9772edcff76082

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: '1.97.0'
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX v5
        run: dotnet tool install --global wix --version 5.0.2

      - name: Install protoc ${{ env.PROTOC_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL -o protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}"
          echo "${PROTOC_SHA256}  protoc.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/protoc"
          unzip -q protoc.zip -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      - name: Build penguind + pdcli (x86_64-pc-windows-msvc)
        shell: bash
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p penguind -p pdcli

      - name: Stage binaries for WiX
        shell: bash
        run: |
          mkdir -p staging
          cp target/x86_64-pc-windows-msvc/release/penguind.exe target/x86_64-pc-windows-msvc/release/pdcli.exe staging/

      - name: Derive version from tag
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $v = "$env:TAG" -replace '^v', ''
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build MSI
        run: >
          wix build packaging/windows/penguind.wxs
          -d Version=${{ steps.ver.outputs.version }}
          -b staging -arch x64 -o penguind.msi

      # TODO(signing): the MSI is UNSIGNED. Once a PenguinTech Authenticode
      # code-signing certificate is provisioned, sign before upload:
      #   signtool sign /fd SHA256 /f cert.pfx /p $env:CERT_PW /tr <timestamp-url> /td SHA256 penguind.msi

      - name: Upload MSI to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$env:TAG" penguind.msi --repo penguintechinc/penguin --clobber
