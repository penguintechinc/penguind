# Integration tier: tests marked `#[ignore]` and gated on PENGUIN_INTEGRATION=1.
#
# These exercise real boundaries the unit gate deliberately excludes — unix
# sockets and the SO_PEERCRED matrix (M2), external plugin subprocesses (M3),
# privileged :53/:123 binds and resolver surgery (M5), and network namespaces
# for WireGuard (M6). The container gets --cap-add NET_ADMIN for exactly that reason.
#
# Unlike the unit gate this tier is functional validation, not a second coverage
# gate; combined coverage is reported informationally by `make
# test-integration-cover`. Actions pinned to commit SHAs.
name: integration

on:
  pull_request:
    paths:
      - "crates/**"
      - "bins/**"
      - "proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - ".github/workflows/integration.yml"
  push:
    branches: [main, "release/**"]

# Container jobs default to `sh`; pin bash so `set -o pipefail` works everywhere.
defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  integration:
    runs-on: ${{ ((github.event_name == 'pull_request' && (github.base_ref == 'main' || github.event.pull_request.head.repo.full_name != github.repository)) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'release') && 'ubuntu-latest' || fromJSON('{"group":"dal2alpha","labels":["dal2-alpha-ci"]}') }}
    container:
      image: rust:1.97-bookworm@sha256:0e2bcaef56d041a486784e54104a81aebe0da44bd03019bd70bc0401e42e4a97
      # NET_ADMIN only: wg_tunnel needs it for netns/WireGuard; with
      # PENGUIN_REQUIRE_NET_ADMIN=1 an unmet precondition fails, never skips.
      options: --cap-add NET_ADMIN
    env:
      PENGUIN_INTEGRATION: "1"
      PENGUIN_REQUIRE_NET_ADMIN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-protoc
      - name: netns/WireGuard scaffolding packages
        # iproute2/wireguard-tools/iputils-ping are the M6 WireGuard netns
        # gate's scaffolding — it drives the CONTROLLED PEER through `ip`/`wg`
        # directly (see wg_tunnel.rs's module doc). openresolv provides
        # `resolvconf`: defguard_wireguard_rs's remove_interface() shells out
        # to it unconditionally on teardown. These need apt, so require root
        # (or passwordless sudo) and fail loudly otherwise — never skip.
        run: |
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then SUDO=""
          elif sudo -n true 2>/dev/null; then SUDO="sudo -n"
          else echo "::error::apt needs root or passwordless sudo (uid=$(id -u))"; exit 1; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends iproute2 wireguard-tools iputils-ping openresolv
      - name: integration tests
        # `penguin-module-tobogganing/integration-test` is required to even
        # compile wg_tunnel.rs (see that crate's Cargo.toml) — without it
        # cargo skips the target entirely rather than failing to find a
        # private module. The test itself self-skips at runtime (printing
        # why, not failing) if this runner's kernel lacks the `wireguard`
        # module; keep this feature flag on regardless, so on any runner
        # that DOES have the module loaded, the gate actually exercises a
        # real tunnel instead of silently never building it.
        run: cargo test --workspace --locked --features penguin-module-tobogganing/integration-test -- --ignored

      # Parity dim 7 (perf) + metrics values-under-load belong in this
      # privileged tier, not plain parity CI — the forwarder QPS / daemon RSS
      # sampling wants a real load generator against a mock DoH upstream
      # (squawk-client testutil), and metric values only populate once the
      # privileged module operations actually run. scripts/parity/perf.sh is
      # informational and NEVER gates (it exits 0 regardless); this step is the
      # declared home for that work, reusing this job's privileged setup rather
      # than duplicating it.
      - name: parity perf (informational, non-gating)
        env:
          PG_PERF_RUN: "1"
        run: scripts/parity/perf.sh
