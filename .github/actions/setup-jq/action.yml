name: Setup jq
description: >-
  Use jq if the runner already has it; otherwise install a pinned,
  sha256-verified jq binary (no apt, no sudo).
runs:
  using: composite
  steps:
    - name: Ensure jq
      shell: bash
      run: |
        set -euo pipefail
        if command -v jq >/dev/null 2>&1; then
          echo "jq already present: $(jq --version)"
          exit 0
        fi
        JQ_VERSION=1.8.2
        case "$(uname -m)" in
          x86_64)  asset=jq-linux-amd64; sha=b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f ;;
          aarch64) asset=jq-linux-arm64; sha=8b85c817833814ddca00a144c33705546355afccf0cf39b188f3cdb48b852309 ;;
          *) echo "::error::unsupported arch $(uname -m)"; exit 1 ;;
        esac
        dest="${RUNNER_TEMP}/jq-bin"
        mkdir -p "$dest"
        curl -sSfL -o "$dest/jq" "https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/${asset}"
        echo "${sha}  ${dest}/jq" | sha256sum -c -
        chmod +x "$dest/jq"
        echo "$dest" >> "$GITHUB_PATH"
        "$dest/jq" --version
