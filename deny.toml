# cargo-deny policy for the penguin Rust workspace.
# Run: cargo deny check   (licenses, advisories, bans, sources)

[advisories]
# Fail on any known RustSec advisory (the cargo-audit equivalent gate).
yanked = "deny"
# Unmaintained-crate advisories, not active exploitable CVEs. Each entry below still
# matches a real transitive dep as of this writing — verify with `cargo tree -i <crate>
# --target all` before removing.
#   - RUSTSEC-2024-0370 (proc-macro-error) + RUSTSEC-2024-0384 (instant) — macOS/Windows-only
#     tray backend (tray-icon/tao/muda -> gtk 0.18 -> glib -> glib-macros -> proc-macro-error;
#     tao -> instant), gated via `cfg(any(target_os = "macos", target_os = "windows"))` in
#     bins/penguin-tray/Cargo.toml. Linux tray uses ksni (D-Bus StatusNotifierItem, GTK-free) and
#     never pulls this chain — only visible with `--target all`, which unions every platform.
#   - RUSTSEC-2024-0436 (paste) — cross-platform, via netlink-packet-core ->
#     defguard_wireguard_rs -> penguin-module-tobogganing (WireGuard networking module);
#     unrelated to the tray/GTK chain above.
ignore = [
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2024-0436",
]

[licenses]
# Permissive licenses only. MPL-2.0 is allowed specifically because the
# vendored hashicorp/go-plugin .proto files carry MPL-2.0 headers.
# MIT-0, Unlicense, and CDLA-Permissive-2.0 are OSI/equivalent permissive.
# LicenseRef-PenguinTech is the internal workspace license.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "Zlib",
    "LicenseRef-PenguinTech",
]
confidence-threshold = 0.9

[bans]
# Surface accidental duplicate dependency versions; not fatal during the port.
multiple-versions = "warn"
# Fail on unpinned external dependencies; workspace members and path deps are allowed.
wildcards = "deny"
# Workspace members (workspace = true) and path dependencies without explicit versions
# are internal pinned crates—not a supply-chain risk. Allow them without treating as wildcards.
allow-wildcard-paths = true

[sources]
# Only crates.io — never a private/internal registry.
unknown-registry = "deny"
unknown-git = "deny"
