[project]
name = "hub-api"
version = "0.1.0"
description = "penguind management hub API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "penguin-dal==0.4.1",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg2-binary==2.9.13",
    "quart==0.20.0",
    "quart-schema==0.22.0",
    "pydantic==2.14.3",
    "hypercorn==0.17.3",
    "penguin-utils==0.3.0",
    "boto3==1.44.0",
    "pyjwt==2.15.1",
    "cryptography==50.0.2",
    "httpx==0.28.1",
    "posthog==7.86.6",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "testcontainers[postgres]==4.15.0",
    "mypy==2.4.1",
    "ruff==0.17.4",
    "pytest-asyncio==1.4.1",
    "moto[s3]==5.2.5",
    "bandit==1.9.2",
]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["penguin_dal.*", "testcontainers.*", "boto3.*", "botocore.*", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-branch --cov-report=term-missing --cov-fail-under=90"
